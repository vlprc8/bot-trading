name: Robot

on:
  schedule:
    # Un passage « journee » démarre chaque heure (minute 17, que GitHub retarde moins que l'heure pile).
    # Chaque passage dure jusqu'à 5h45 (limite GitHub : 6 h) ; le suivant attend son tour et prend le relais.
    # Matin (propositions), écoute de tes Oui / Non en direct, surveillance +20 % en séance, bilan du soir.
    - cron: "17 6-21 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        options: [journee, etat, exemple, validation, connexion, matin, soir, stop]
        default: etat
      attente:
        description: "validation : écouter Telegram pendant N secondes"
        default: "0"

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # une écoute « validation » peut durer jusqu'à l'ouverture
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choisir le passage
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=journee" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer le robot (${{ steps.mode.outputs.mode }})
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python lancer_robot.py "${{ steps.mode.outputs.mode }}" --attente "${{ inputs.attente || 0 }}"

      - name: Enregistrer l'état du robot
        if: always()
        run: |
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          git add robot/
          git commit -m "Robot : ${{ steps.mode.outputs.mode }} du $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
