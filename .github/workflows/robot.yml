name: Robot

on:
  schedule:
    - cron: "0 7 * * 1-5"       # matin : 8h Paris en hiver, 9h en été -> propositions d'achat
    - cron: "*/10 7-14 * * 1-5" # toutes les 10 min jusqu'à l'ouverture -> lit tes Oui / Non
    - cron: "30 21 * * 1-5"     # soir : après la clôture de New York -> bilan
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ?"
        type: choice
        options: [etat, exemple, validation, connexion, matin, soir, stop]
        default: etat
      attente:
        description: "validation : écouter Telegram pendant N secondes"
        default: "0"

concurrency:
  group: robot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choisir le passage
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 21 * * 1-5" ]; then
            echo "mode=soir" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1-5" ]; then
            echo "mode=matin" >> "$GITHUB_OUTPUT"
          else
            echo "mode=validation" >> "$GITHUB_OUTPUT"
          fi

      - name: Lancer le robot (${{ steps.mode.outputs.mode }})
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python lancer_robot.py "${{ steps.mode.outputs.mode }}" --attente "${{ inputs.attente || 0 }}"

      - name: Enregistrer l'état du robot
        if: always()
        run: |
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          git add robot/
          git commit -m "Robot : ${{ steps.mode.outputs.mode }} du $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
