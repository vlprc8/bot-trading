name: Backtest

# Se lance à la main : onglet Actions > Backtest > Run workflow.
on:
  workflow_dispatch:
    inputs:
      frais:
        description: "Frais par côté (0.001 = 0,10 %)"
        default: "0.001"
      positions:
        description: "Positions simultanées au maximum"
        default: "5"
      lot:
        description: "0 = lots 1 et 2 ; 3 = stratégies de la recherche + S&P 500 historique"
        default: "0"

permissions:
  contents: write   # pour enregistrer le rapport dans le dépôt

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les bibliothèques
        run: pip install -r requirements.txt

      - name: Vérifier le moteur (tests)
        run: python -m unittest discover -s tests -v

      - name: Télécharger les données et lancer le backtest
        run: python lancer_backtest.py --telecharger --frais "${{ inputs.frais }}" --positions "${{ inputs.positions }}" --lot "${{ inputs.lot }}"

      - name: Afficher le résumé
        run: cat rapport/RESULTATS.md rapport/lot3/RESULTATS.md 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true

      - name: Enregistrer les données et le rapport dans le dépôt
        run: |
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          git add data rapport
          git commit -m "Backtest du $(date -u +%Y-%m-%d)" || echo "Rien de nouveau"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
